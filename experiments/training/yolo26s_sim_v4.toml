# YOLO26s on sim_v4 (2026-11-13): final training data. All scenes hybrid on
# background library v2 (inactive-phase windows, v1/v2-screened, recording
# gate), fish-disjoint chirp templates per split. Same settings as
# yolo26s_sim_v3. Final fit only: train groups to fit, val groups for early
# stopping and best-epoch selection.
seed = 0
deterministic = true
device = "cuda"
max_vram_fraction = 0.3
score_threshold = 0.5

[model]
type = "ultralytics-yolo"
architecture = "yolo26s"
pretrained = true

[optim]
epochs = 80
batch = 32
optimizer = "AdamW"
lr0 = 0.001
lrf = 0.01
schedule = "cosine"
warmup_epochs = 1.0
weight_decay = 0.0005
momentum = 0.937
patience = 15
amp = true
workers = 8

[augment]
time_flip = 0.0

[cv]
n_folds = 0
final_fit = true
