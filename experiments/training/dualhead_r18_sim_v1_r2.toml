# Dual-head RT-DETRv2-r18 (boxes + emitter EODf) on sim_v1 (2026-11-12), run 2.
# Run 1 (30 epochs) was stopped after 5 epochs, when other jobs saturated the
# /mnt/data1 HDD and the loader fell to 16-25 img/s (30-45 min per epoch).
# Run 2 reads a byte-identical copy of sim_v1 on NVMe
# (/home/weygoldt/chirp_v2_fast/datasets/sim_v1, same content_sha256, files re-hashed
# by the validator) and trains 20 epochs at batch 8 (cap 0.25), so that the
# GPU total stays under the watchdog's 15 GB beside two YOLO26 runs and the
# chirp-parameter study.
# Final fit only: train groups to fit, val groups for early stopping and
# best-epoch selection (fitness = AP x assignment accuracy). The GPU is
# shared with the YOLO26 runs; batch 16 peaked at ~3.1 GiB in run 1.
seed = 0
# deformable attention (grid_sample) has no deterministic backward on CUDA
deterministic = false
device = "cuda"
max_vram_fraction = 0.25
score_threshold = 0.5

[model]
type = "dualhead"
architecture = "rtdetr_v2_r18vd"
pretrained = true
num_queries = 300
num_denoising = 100
max_det = 50
emitter_loss_weight = 10.0
backbone_lr_scale = 0.1
grad_clip = 0.1
ema_decay = 0.9999
time_shift_px = 32
val_max_images = 2000

[optim]
epochs = 20
batch = 8
optimizer = "AdamW"
lr0 = 0.0001
lrf = 0.05
schedule = "cosine"
warmup_epochs = 0.5
weight_decay = 0.0001
patience = 5
amp = true
workers = 8

[augment]
time_flip = 0.0

[cv]
n_folds = 0
final_fit = true
