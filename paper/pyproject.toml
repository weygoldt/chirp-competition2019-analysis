[project]
name = "chirp-competition-paper"
version = "0.1.0"
description = "Analyses and figures of the chirp competition manuscript, rerun on the v2 chirp detections"
requires-python = ">=3.14,<3.15"
dependencies = [
    "arviz>=0.21,<1",
    "bambi>=0.15",
    "ipython>=9.2",
    "lifelines>=0.30",
    "matplotlib>=3.10.3,<3.11",
    "numpy>=2.2",
    "pandas>=2.2.3,<3",
    "pillow>=11",
    "pyarrow>=20",
    "pymc>=5.22",
    "rich>=14",
    "scipy>=1.15",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "thunderfish>=2.1",
    "thunderlab>=1.0",
    "typer>=0.15",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
