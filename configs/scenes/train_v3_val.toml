# Training scenes v3, val split (2026-11-12): hybrid only. Every scene puts
# simulated fish on a real background segment, which replaces the synthetic
# electrode noise, hum and clicks. The author dropped synthetic-noise-only
# scenes from training, model selection and testing (too Gaussian, not the data
# the detector is for). Otherwise identical to train_v2_val.toml, including the
# background recordings of this split (disjoint across train/val/test).
name = "train_v3_val"
duration_s = 60.0

[population]
close_pair_prob = 0.3

[chirps]
rate_hz = [0.05, 0.25]

[background]
library = "/mnt/data1/chirp_v2/background/v1"
prob = 1.0
unscreened_weight = 0.3
max_real_gap_db = 30.0
include_groups = ["competition2019/2019-11-29-09_59", "competition2019/2019-12-02-10_00", "competition2019/2019-12-10-10_00", "competition2019/2020-03-16-10_00", "competition2019/2020-05-19-10_00", "competition2022/2022-06-13-10_00", "competition2022/2022-06-14-10_00", "field_flona2025/site_6", "field_iriri2026/iriri01_lago-de-pedro/grid03"]

[plot]
enabled = false
