# Training scenes v3, test split (2026-11-12): hybrid only. Every scene puts
# simulated fish on a real background segment, which replaces the synthetic
# electrode noise, hum and clicks. The author dropped synthetic-noise-only
# scenes from training, model selection and testing (too Gaussian, not the data
# the detector is for). Otherwise identical to train_v2_test.toml, including the
# background recordings of this split (disjoint across train/val/test).
name = "train_v3_test"
duration_s = 60.0

[population]
close_pair_prob = 0.3

[chirps]
rate_hz = [0.05, 0.25]

[background]
library = "/mnt/data1/chirp_v2/background/v1"
prob = 1.0
unscreened_weight = 0.3
max_real_gap_db = 30.0
include_groups = ["competition2019/2019-11-27-10_00", "competition2019/2019-12-03-10_01", "competition2019/2020-03-11-09_56", "competition2019/2020-06-04-10_00", "competition2019/2020-06-11-10_00", "competition2022/2022-05-10-10_00", "competition2022/2022-06-29-10_00", "field_flona2025/site_9", "field_iriri2026/iriri01_lago-de-pedro/grid02"]

[plot]
enabled = false
